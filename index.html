<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie Familiale</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- TITRE CENTRAL --- */
        .welcome-core {
            position: relative;
            z-index: 100;
            background: white;
            padding: 30px 60px;
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            animation: pulse 4s infinite ease-in-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            color: #1e293b;
            margin: 0;
        }

        /* --- LE CONTENEUR D'ORBITE --- */
        /* Il fait la taille de l'écran pour être sûr de tout voir */
        .orbit-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateOrbit 40s linear infinite;
        }

        /* --- LES TUILES --- */
        .tile {
            position: absolute;
            padding: 12px 25px;
            background: white;
            border-radius: 12px;
            font-weight: 600;
            color: #475569;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            /* On annule la rotation du conteneur pour rester droit */
            animation: counterRotate 40s linear infinite;
        }

        /* POSITIONNEMENT GÉOMÉTRIQUE (Rayon de 300px) */
        /* On utilise top/left 50% et on décale avec margin */
        .t1 { top: calc(50% - 300px); left: 50%; transform: translateX(-50%); border-top: 4px solid #6366f1; }
        .t2 { top: calc(50% - 212px); left: calc(50% + 212px); border-right: 4px solid #f472b6; }
        .t3 { top: 50%; left: calc(50% + 300px); transform: translateY(-50%); box-shadow: 0 0 15px #fbbf24; }
        .t4 { top: calc(50% + 212px); left: calc(50% + 212px); border: 2px dashed #4ade80; }
        .t5 { top: calc(50% + 300px); left: 50%; transform: translateX(-50%); background: #f1f5f9; }
        .t6 { top: calc(50% + 212px); left: calc(50% - 212px); border-radius: 50px; border: 1px solid #94a3b8; }
        .t7 { top: 50%; left: calc(50% - 300px); transform: translateY(-50%); font-style: italic; }
        .t8 { top: calc(50% - 212px); left: calc(50% - 212px); background: linear-gradient(white, #e2e8f0); }

        /* EFFET AU CLIC */
        .tile.active {
            scale: 2.5;
            z-index: 1000;
            background: #1e293b !important;
            color: white !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- ANIMATIONS --- */
        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Arrêt au survol */
        .orbit-container:hover, .orbit-container:hover .tile {
            animation-play-state: paused;
        }

        /* Adaptation petits écrans */
        @media (max-width: 800px) {
            .t1 { top: calc(50% - 150px); }
            .t2 { top: calc(50% - 106px); left: calc(50% + 106px); }
            .t3 { left: calc(50% + 150px); }
            .t4 { top: calc(50% + 106px); left: calc(50% + 106px); }
            .t5 { top: calc(50% + 150px); }
            .t6 { top: calc(50% + 106px); left: calc(50% - 106px); }
            .t7 { left: calc(50% - 150px); }
            .t8 { top: calc(50% - 106px); left: calc(50% - 106px); }
        }
    </style>
</head>
<body>

    <div class="welcome-core">
        <h1>Bienvenue</h1>
    </div>

    <div class="orbit-container">
        <div class="tile t1" onclick="toggle(this)">Fabien</div>
        <div class="tile t2" onclick="toggle(this)">Clément</div>
        <div class="tile t3" onclick="toggle(this)">Célestine</div>
        <div class="tile t4" onclick="toggle(this)">Yvon</div>
        <div class="tile t5" onclick="toggle(this)">Isabelle</div>
        <div class="tile t6" onclick="toggle(this)">Bernard</div>
        <div class="tile t7" onclick="toggle(this)">Paulette</div>
        <div class="tile t8" onclick="toggle(this)">Corentin</div>
    </div>

    <script>
        function toggle(el) {
            if(el.classList.contains('active')) {
                el.classList.remove('active');
            } else {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>
</body>
</html>
