<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie</title>
    <style>
        /* On force le body à prendre tout l'écran sans marges */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* TITRE CENTRAL FIXE */
        .welcome {
            position: absolute;
            z-index: 100;
            background: white;
            padding: 20px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-size: 2.5rem;
            font-weight: bold;
            color: #1e293b;
        }

        /* ZONE DES PRÉNOMS (L'Univers) */
        .universe {
            position: relative;
            width: 80vw;  /* Prend 80% de la largeur de ton écran */
            height: 80vh; /* Prend 80% de la hauteur de ton écran */
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotate 30s linear infinite;
            /* border: 2px dashed red; */ /* ENLÈVE LE COMMENTAIRE SI TU NE VOIS RIEN */
        }

        /* STYLE DES PRÉNOMS */
        .name-tile {
            position: absolute;
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: bold;
            cursor: pointer;
            animation: counter-rotate 30s linear infinite;
            transition: all 0.3s;
        }

        /* PLACEMENT PAR TRANSFORMATION (Incassable) */
        /* Chaque tuile est poussée vers l'extérieur du centre */
        .t1 { transform: rotate(0deg)   translate(250px); border-top: 4px solid #6366f1; }
        .t2 { transform: rotate(45deg)  translate(250px); border-top: 4px solid #f472b6; }
        .t3 { transform: rotate(90deg)  translate(250px); border-top: 4px solid #fbbf24; }
        .t4 { transform: rotate(135deg) translate(250px); border-top: 4px solid #4ade80; }
        .t5 { transform: rotate(180deg) translate(250px); border-top: 4px solid #06b6d4; }
        .t6 { transform: rotate(225deg) translate(250px); border-top: 4px solid #f97316; }
        .t7 { transform: rotate(270deg) translate(250px); border-top: 4px solid #8b5cf6; }
        .t8 { transform: rotate(315deg) translate(250px); border-top: 4px solid #ef4444; }

        /* EFFET AU CLIC */
        .name-tile.active {
            scale: 2;
            background: #1e293b;
            color: white;
            z-index: 1000;
        }

        /* ANIMATIONS */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counter-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .name-tile { padding: 5px 10px; font-size: 0.8rem; }
            .t1, .t2, .t3, .t4, .t5, .t6, .t7, .t8 { translate: 120px; }
        }
    </style>
</head>
<body>

    <div class="welcome">Bienvenue</div>

    <div class="universe">
        <div class="name-tile t1" onclick="this.classList.toggle('active')">Fabien</div>
        <div class="name-tile t2" onclick="this.classList.toggle('active')">Clément</div>
        <div class="name-tile t3" onclick="this.classList.toggle('active')">Célestine</div>
        <div class="name-tile t4" onclick="this.classList.toggle('active')">Yvon</div>
        <div class="name-tile t5" onclick="this.classList.toggle('active')">Isabelle</div>
        <div class="name-tile t6" onclick="this.classList.toggle('active')">Bernard</div>
        <div class="name-tile t7" onclick="this.classList.toggle('active')">Paulette</div>
        <div class="name-tile t8" onclick="this.classList.toggle('active')">Corentin</div>
    </div>

</body>
</html>
