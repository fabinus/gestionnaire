<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie Familiale</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --orbit-radius: 280px; /* Distance entre le centre et les tuiles */
            --speed: 30s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- LE TITRE CENTRAL --- */
        .welcome-core {
            position: absolute;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 60px;
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #1e293b;
            margin: 0;
        }

        /* --- LE SYSTÈME D'ORBITE --- */
        .orbit-wrapper {
            position: relative;
            width: 1px; height: 1px; /* Centre virtuel */
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateAll var(--speed) linear infinite;
        }

        /* Chaque "bras" de l'étoile */
        .arm {
            position: absolute;
            width: calc(var(--orbit-radius) * 2);
            height: 50px;
            display: flex;
            justify-content: flex-end; /* Pousse la tuile au bout du bras */
            align-items: center;
            pointer-events: none; /* Le bras ne bloque pas les clics */
        }

        /* Positionnement angulaire des bras */
        .arm:nth-child(1) { transform: rotate(0deg); }
        .arm:nth-child(2) { transform: rotate(45deg); }
        .arm:nth-child(3) { transform: rotate(90deg); }
        .arm:nth-child(4) { transform: rotate(135deg); }
        .arm:nth-child(5) { transform: rotate(180deg); }
        .arm:nth-child(6) { transform: rotate(225deg); }
        .arm:nth-child(7) { transform: rotate(270deg); }
        .arm:nth-child(8) { transform: rotate(315deg); }

        /* --- LA TUILE (AU BOUT DU BRAS) --- */
        .tile {
            pointer-events: auto; /* Réactive le clic sur la tuile */
            padding: 12px 24px;
            background: white;
            border-radius: 12px;
            font-weight: 600;
            color: #475569;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            
            /* Animation inverse pour garder le texte droit */
            animation: counterRotate var(--speed) linear infinite;
        }

        /* --- EFFETS SPÉCIAUX PAR TUILE --- */
        .arm:nth-child(1) .tile { border-bottom: 4px solid #6366f1; }
        .arm:nth-child(2) .tile { background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); border: 1px solid white; }
        .arm:nth-child(3) .tile { box-shadow: 5px 5px 15px #cbd5e1, -5px -5px 15px #ffffff; }
        .arm:nth-child(4) .tile { border: 2px dashed #f472b6; }
        .arm:nth-child(5) .tile { filter: drop-shadow(0 0 8px #fbbf24); }
        .arm:nth-child(6) .tile { text-transform: uppercase; letter-spacing: 1px; background: #f1f5f9; }
        .arm:nth-child(7) .tile { border-radius: 40px; border: 1px solid #94a3b8; }
        .arm:nth-child(8) .tile { background: linear-gradient(135deg, #ffffff, #e2e8f0); }

        /* --- ETAT ACTIF (AU CLIC) --- */
        .tile.active {
            transform: scale(1.8);
            background: #1e293b !important;
            color: #ffffff !important;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- ANIMATIONS --- */
        @keyframes rotateAll {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Pause au survol */
        .orbit-wrapper:hover, 
        .orbit-wrapper:hover .tile {
            animation-play-state: paused;
        }

        /* Mobile */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            :root { var(--orbit-radius): 150px; }
            .arm { width: 300px; }
        }
    </style>
</head>
<body>

    <div class="welcome-core">
        <h1>Bienvenue</h1>
    </div>

    <div class="orbit-wrapper">
        <div class="arm"><div class="tile" onclick="select(this)">Fabien</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Clément</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Célestine</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Yvon</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Isabelle</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Bernard</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Paulette</div></div>
        <div class="arm"><div class="tile" onclick="select(this)">Corentin</div></div>
    </div>

    <script>
        function select(el) {
            // Si déjà actif, on désactive
            if(el.classList.contains('active')) {
                el.classList.remove('active');
            } else {
                // On nettoie les autres et on active celle-là
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>
</body>
</html>
