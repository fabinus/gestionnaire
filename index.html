<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie Familiale</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7fa;
            --tile-bg: rgba(255, 255, 255, 0.8);
            --accent: #4a90e2;
            --text: #1a202c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #ffffff 0%, #e2e8f0 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text);
        }

        /* --- CONTENEUR D'ORBITE --- */
        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CŒUR CENTRAL --- */
        .center-card {
            position: relative;
            z-index: 100;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 50%;
            width: 260px;
            height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04), inset 0 0 20px rgba(255,255,255,1);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .center-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--text);
            font-weight: 900;
            margin: 5px 0;
        }

        .center-card span {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- SYSTÈME ORBITAL --- */
        .orbit-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 45s linear infinite;
        }

        .tile {
            position: absolute;
            width: 120px;
            height: 50px;
            background: var(--tile-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 400;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.9);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: counter-rotate 45s linear infinite;
        }

        /* Styles spécifiques discrets */
        .t1 { top: 0%; left: 50%; translate: -50% 0; box-shadow: 0 5px 15px rgba(74, 144, 226, 0.1); }
        .t2 { top: 15%; left: 85%; border-left: 3px solid #ed64a6; }
        .t3 { top: 50%; left: 100%; translate: -100% -50%; border-bottom: 3px solid #ecc94b; }
        .t4 { top: 85%; left: 85%; font-weight: 600; }
        .t5 { top: 100%; left: 50%; translate: -50% -100%; box-shadow: 0 -5px 15px rgba(0,0,0,0.02); }
        .t6 { top: 85%; left: 15%; translate: -100% 0; border-radius: 30px; }
        .t7 { top: 50%; left: 0%; translate: 0 -50%; border-right: 3px solid #4a90e2; }
        .t8 { top: 15%; left: 15%; translate: -100% 0; background: rgba(255,255,255,0.95); }

        /* Interactions */
        .tile:hover {
            background: white;
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .tile.active {
            transform: scale(2.2) !important;
            z-index: 500;
            background: #1a202c;
            color: white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            font-weight: 600;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Pause au survol */
        .orbit-wrapper:hover, .orbit-wrapper:hover .tile {
            animation-play-state: paused;
        }

        @media (max-width: 700px) {
            .orbit-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="orbit-container">
        <!-- Cœur de l'univers -->
        <div class="center-card">
            <span>Univers</span>
            <h1>Bienvenue</h1>
            <div style="width: 20px; height: 3px; background: var(--accent); margin: 0 auto; border-radius: 10px;"></div>
        </div>

        <!-- Système orbital -->
        <div class="orbit-wrapper">
            <div class="tile t1" onclick="toggleActive(this)">Fabien</div>
            <div class="tile t2" onclick="toggleActive(this)">Clément</div>
            <div class="tile t3" onclick="toggleActive(this)">Célestine</div>
            <div class="tile t4" onclick="toggleActive(this)">Yvon</div>
            <div class="tile t5" onclick="toggleActive(this)">Isabelle</div>
            <div class="tile t6" onclick="toggleActive(this)">Bernard</div>
            <div class="tile t7" onclick="toggleActive(this)">Paulette</div>
            <div class="tile t8" onclick="toggleActive(this)">Corentin</div>
        </div>
    </div>

    <script>
        function toggleActive(el) {
            if(el.classList.contains('active')) {
                el.classList.remove('active');
            } else {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>

</body>
</html>
