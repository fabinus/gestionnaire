<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxie Familiale</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060a0f;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }
    .nebula-1 { width: 500px; height: 500px; background: rgba(100,60,200,0.10); top: -150px; left: -150px; }
    .nebula-2 { width: 600px; height: 600px; background: rgba(30,100,180,0.07); bottom: -200px; right: -200px; }
    .nebula-3 { width: 300px; height: 300px; background: rgba(200,140,20,0.06); top: 50%; left: 50%; transform: translate(-50%,-50%); }

    .orbit-scene {
      position: relative;
      z-index: 10;
      width: 560px;
      height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.13);
    }
    .orbit-ring::after {
      content: '';
      position: absolute;
      inset: 35px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.05);
    }

    .trail {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px dashed rgba(212,175,55,0.07);
      pointer-events: none;
    }

    .shine-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 50%;
      transform-origin: bottom center;
      background: linear-gradient(to top, rgba(212,175,55,0.12), transparent);
      pointer-events: none;
    }

    .core {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #1a1410 0%, #0a0c12 60%, #06070d 100%);
      border: 1px solid rgba(212,175,55,0.28);
      box-shadow:
        0 0 60px rgba(212,175,55,0.07),
        inset 0 0 50px rgba(0,0,0,0.7),
        0 0 140px rgba(212,175,55,0.03);
    }
    .core::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.05);
    }
    .core::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.025);
    }

    .core-label {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 7px;
      color: rgba(212,175,55,0.45);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .core-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: #f0e8d0;
      line-height: 1;
      letter-spacing: 3px;
    }
    .core-line {
      width: 44px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.7), transparent);
      margin-top: 14px;
    }
    .core-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.72rem;
      font-style: italic;
      color: rgba(212,175,55,0.38);
      margin-top: 10px;
      letter-spacing: 1px;
    }

    .orbit-wrap {
      position: absolute;
      inset: 0;
      animation: spin 60s linear infinite;
    }

    .node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: counter-spin 60s linear infinite;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .node-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(212,175,55,0.45);
      margin-bottom: 7px;
      transition: all 0.4s ease;
      box-shadow: 0 0 6px rgba(212,175,55,0.25);
    }
    .node-name {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 400;
      color: rgba(220,200,160,0.65);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.4s ease;
    }

    .node:hover .node-dot {
      background: #d4af37;
      transform: scale(1.7);
      box-shadow: 0 0 16px rgba(212,175,55,0.75);
    }
    .node:hover .node-name {
      color: #f0e8d0;
      text-shadow: 0 0 18px rgba(212,175,55,0.5);
    }
    .node.active .node-dot {
      background: #ffd700;
      transform: scale(2.2);
      box-shadow: 0 0 28px rgba(255,215,0,0.95);
    }
    .node.active .node-name {
      color: #ffd700;
      text-shadow: 0 0 28px rgba(255,215,0,0.75);
      font-size: 0.72rem;
    }

    .n1 { top: 0%;   left: 50%; translate: -50% 0; }
    .n2 { top: 8%;   left: 83%; }
    .n3 { top: 38%;  left: 97%; translate: -100% -50%; }
    .n4 { top: 78%;  left: 83%; }
    .n5 { top: 97%;  left: 50%; translate: -50% -100%; }
    .n6 { top: 78%;  left: 17%; translate: -100% 0; }
    .n7 { top: 38%;  left: 3%;  translate: 0 -50%; }
    .n8 { top: 8%;   left: 17%; translate: -100% 0; }

    #tooltip {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: rgba(212,175,55,0.55);
      letter-spacing: 1.5px;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }
    #tooltip.show { opacity: 1; }

    .orbit-wrap:hover,
    .orbit-wrap:hover .node {
      animation-play-state: paused;
    }

    @keyframes spin         { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
    @keyframes counter-spin { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }

    @media (max-width: 640px) {
      .orbit-scene { transform: scale(0.62); }
    }
    @media (max-width: 400px) {
      .orbit-scene { transform: scale(0.48); }
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <div class="orbit-scene">
    <div class="orbit-ring"></div>
    <div class="trail"></div>

    <div class="shine-line" style="transform:rotate(0deg)"></div>
    <div class="shine-line" style="transform:rotate(45deg)"></div>
    <div class="shine-line" style="transform:rotate(90deg)"></div>
    <div class="shine-line" style="transform:rotate(135deg)"></div>
    <div class="shine-line" style="transform:rotate(180deg)"></div>
    <div class="shine-line" style="transform:rotate(225deg)"></div>
    <div class="shine-line" style="transform:rotate(270deg)"></div>
    <div class="shine-line" style="transform:rotate(315deg)"></div>

    <div class="core">
      <span class="core-label">Univers</span>
      <span class="core-title">Bienvenue</span>
      <div class="core-line"></div>
      <span class="core-sub">Galaxie Familiale</span>
    </div>

    <div class="orbit-wrap" id="orbitWrap">
      <div class="node n1" onclick="activate(this,'Fabien')">    <div class="node-dot"></div><span class="node-name">Fabien</span></div>
      <div class="node n2" onclick="activate(this,'Clément')">   <div class="node-dot"></div><span class="node-name">Clément</span></div>
      <div class="node n3" onclick="activate(this,'Célestine')"> <div class="node-dot"></div><span class="node-name">Célestine</span></div>
      <div class="node n4" onclick="activate(this,'Yvon')">      <div class="node-dot"></div><span class="node-name">Yvon</span></div>
      <div class="node n5" onclick="activate(this,'Isabelle')">  <div class="node-dot"></div><span class="node-name">Isabelle</span></div>
      <div class="node n6" onclick="activate(this,'Bernard')">   <div class="node-dot"></div><span class="node-name">Bernard</span></div>
      <div class="node n7" onclick="activate(this,'Paulette')">  <div class="node-dot"></div><span class="node-name">Paulette</span></div>
      <div class="node n8" onclick="activate(this,'Corentin')">  <div class="node-dot"></div><span class="node-name">Corentin</span></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 180 }, () => ({
      x:     Math.random(),
      y:     Math.random(),
      r:     Math.random() * 1.3 + 0.2,
      o:     Math.random() * 0.55 + 0.08,
      speed: Math.random() * 0.3 + 0.04
    }));

    let t = 0;
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += 0.005;
      stars.forEach(s => {
        const op = s.o * (0.55 + 0.45 * Math.sin(t * s.speed + s.x * 12));
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,210,185,${op})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    const msgs = {
      'Fabien':    'Une étoile de la constellation familiale',
      'Clément':   'Lumière brillante dans notre galaxie',
      'Célestine': 'Astre précieux et singulier',
      'Yvon':      'Pilier de notre univers',
      'Isabelle':  'Éclat doux et chaleureux',
      'Bernard':   'Force tranquille et fidèle',
      'Paulette':  'Flamme douce et ancienne',
      'Corentin':  'Nouvelle étoile en formation'
    };

    const tip = document.getElementById('tooltip');

    function activate(el, name) {
      const nodes = document.querySelectorAll('.node');
      if (el.classList.contains('active')) {
        el.classList.remove('active');
        tip.classList.remove('show');
      } else {
        nodes.forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        tip.textContent = msgs[name] || '';
        tip.classList.add('show');
      }
    }
  </script>

</body>
</html>
