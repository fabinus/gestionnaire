<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxie Familiale</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #01030a; }
    body { display: flex; align-items: center; justify-content: center; }

    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #cBg  { z-index: 1; }
    #cMid { z-index: 2; }
    #cFx  { z-index: 4; pointer-events: none; }

    .scene {
      position: fixed; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .sys { position: relative; width: 520px; height: 520px; pointer-events: none; }

    .ring { position: absolute; border-radius: 50%; pointer-events: none; }
    .r1 { inset: 0;     border: 1px solid rgba(212,175,55,0.12); animation: rSpin 100s linear infinite; }
    .r2 { inset: 52px;  border: 1px solid rgba(212,175,55,0.07); animation: rSpin 140s linear infinite reverse; }
    .r3 { inset: 104px; border: 1px solid rgba(212,175,55,0.04); animation: rSpin 80s linear infinite; }
    .rp { position: absolute; inset: -18px; border: 1px solid rgba(212,175,55,0.06); border-radius: 50%; animation: rPulse 5s ease-in-out infinite; pointer-events: none; }

    .orbit { position: absolute; inset: 0; animation: rSpin 75s linear infinite; pointer-events: none; }

    .node {
      position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: rSpin 75s linear infinite reverse;
      cursor: pointer; pointer-events: all; -webkit-tap-highlight-color: transparent;
    }
    .gem {
      width: 11px; height: 11px; border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, rgba(255,248,200,0.95), rgba(212,175,55,0.55) 45%, rgba(90,55,5,0.7));
      box-shadow: 0 0 8px rgba(212,175,55,0.45), 0 0 22px rgba(212,175,55,0.12);
      transition: all 0.55s cubic-bezier(0.34,1.56,0.64,1);
    }
    .lbl {
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 500;
      color: rgba(238,218,162,0.82); letter-spacing: 3px; text-transform: uppercase;
      white-space: nowrap; transition: all 0.5s ease;
      text-shadow: 0 0 18px rgba(212,175,55,0.18);
    }
    .node:hover .gem { transform: scale(2.1); box-shadow: 0 0 22px rgba(212,175,55,1), 0 0 45px rgba(212,175,55,0.35); }
    .node:hover .lbl { color: #ffe9a8; text-shadow: 0 0 28px rgba(212,175,55,0.65); letter-spacing: 4px; }
    .node.on .gem {
      transform: scale(3.2);
      background: radial-gradient(circle at 32% 32%, #fff9e0, #ffd700 38%, #b8820a 75%);
      box-shadow: 0 0 35px rgba(255,215,0,1), 0 0 70px rgba(255,200,0,0.6), 0 0 120px rgba(255,170,0,0.25);
    }
    .node.on .lbl {
      color: #ffd700; font-size: 1.6rem; letter-spacing: 6px; font-weight: 600;
      text-shadow: 0 0 35px rgba(255,215,0,0.9), 0 0 70px rgba(255,190,0,0.45);
    }

    .n0 { top: 1%;  left: 50%; translate: -50% 0; }
    .n1 { top: 14%; left: 87%; }
    .n2 { top: 44%; left: 99%; translate: -100% -50%; }
    .n3 { top: 76%; left: 87%; }
    .n4 { top: 91%; left: 50%; translate: -50% -100%; }
    .n5 { top: 76%; left: 13%; translate: -100% 0; }
    .n6 { top: 44%; left: 1%;  translate: 0 -50%; }
    .n7 { top: 14%; left: 13%; translate: -100% 0; }

    .core-w { position: absolute; top: 50%; left: 50%; translate: -50% -50%; z-index: 10; pointer-events: none; }
    .core {
      width: 216px; height: 216px; border-radius: 50%;
      background: conic-gradient(from 200deg, #0e0a05, #1e1609, #100d06, #1a1308, #070508, #0e0a05);
      border: 1px solid rgba(212,175,55,0.38);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
      box-shadow: 0 0 0 1px rgba(212,175,55,0.08), 0 0 0 4px rgba(212,175,55,0.04), 0 0 70px rgba(212,175,55,0.07), inset 0 0 50px rgba(0,0,0,0.85);
      animation: cBreath 9s ease-in-out infinite;
    }
    .ceye  { font-family: 'Cinzel', serif; font-size: 0.4rem; letter-spacing: 9px; color: rgba(212,175,55,0.38); text-transform: uppercase; }
    .ctitle {
      font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; line-height: 1; letter-spacing: 3px;
      background: linear-gradient(155deg, #f8edcf 0%, #d4af37 40%, #8b6510 75%, #c8a020 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .crule { width: 38px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.65), transparent); }
    .csub  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.62rem; color: rgba(212,175,55,0.3); letter-spacing: 2px; }

    .tip-w {
      position: fixed; bottom: 36px; left: 50%; translate: -50% 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      opacity: 0; transition: opacity 0.7s ease; pointer-events: none;
    }
    .tip-w.on { opacity: 1; }
    .tip-ln { width: 1px; height: 22px; background: linear-gradient(to bottom, rgba(212,175,55,0.55), transparent); }
    .tip-tx { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: rgba(212,175,55,0.65); letter-spacing: 2px; white-space: nowrap; }

    @keyframes rSpin  { to { transform: rotate(360deg); } }
    @keyframes rPulse { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.05);opacity:0.15} }
    @keyframes cBreath {
      0%,100% { box-shadow: 0 0 0 1px rgba(212,175,55,0.08),0 0 0 4px rgba(212,175,55,0.04),0 0 70px rgba(212,175,55,0.07),inset 0 0 50px rgba(0,0,0,0.85); }
      50%      { box-shadow: 0 0 0 1px rgba(212,175,55,0.16),0 0 0 4px rgba(212,175,55,0.08),0 0 110px rgba(212,175,55,0.14),inset 0 0 50px rgba(0,0,0,0.85); }
    }

    @media (max-width: 600px) { .sys { transform: scale(0.6); } }
    @media (max-width: 380px) { .sys { transform: scale(0.46); } }
  </style>
</head>
<body>

  <canvas id="cBg"></canvas>
  <canvas id="cMid"></canvas>
  <canvas id="cFx"></canvas>

  <div class="scene">
    <div class="sys">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="rp"></div>
      <div class="orbit">
        <div class="node n0" data-msg="Une étoile de la constellation familiale"><div class="gem"></div><span class="lbl">Fabien</span></div>
        <div class="node n1" data-msg="Lumière brillante dans notre galaxie"><div class="gem"></div><span class="lbl">Clément</span></div>
        <div class="node n2" data-msg="Astre précieux et singulier"><div class="gem"></div><span class="lbl">Célestine</span></div>
        <div class="node n3" data-msg="Pilier de notre univers"><div class="gem"></div><span class="lbl">Yvon</span></div>
        <div class="node n4" data-msg="Éclat doux et chaleureux"><div class="gem"></div><span class="lbl">Isabelle</span></div>
        <div class="node n5" data-msg="Force tranquille et fidèle"><div class="gem"></div><span class="lbl">Bernard</span></div>
        <div class="node n6" data-msg="Flamme douce et ancienne"><div class="gem"></div><span class="lbl">Paulette</span></div>
        <div class="node n7" data-msg="Nouvelle étoile en formation"><div class="gem"></div><span class="lbl">Corentin</span></div>
      </div>
      <div class="core-w">
        <div class="core">
          <span class="ceye">Univers</span>
          <span class="ctitle">Bienvenue</span>
          <div class="crule"></div>
          <span class="csub">Galaxie Familiale</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tip-w" id="tip">
    <div class="tip-ln"></div>
    <div class="tip-tx" id="tipTx"></div>
  </div>

  <script>
  (() => {
    const cBg = document.getElementById('cBg');
    const cMid = document.getElementById('cMid');
    const cFx  = document.getElementById('cFx');
    const bx = cBg.getContext('2d');
    const mx = cMid.getContext('2d');
    const fx = cFx.getContext('2d');

    function resize() {
      [cBg, cMid, cFx].forEach(c => { c.width = window.innerWidth; c.height = window.innerHeight; });
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 300 }, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.5 + 0.1,
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.009 + 0.002,
      warm: Math.random() > 0.65,
      bright: Math.random() > 0.97
    }));

    const shooters = [];
    function spawnShooter() {
      const side = Math.floor(Math.random() * 4);
      let x, y, vx, vy;
      if      (side === 0) { x = Math.random(); y = 0; vx = (Math.random()-0.5)*0.003; vy = Math.random()*0.003+0.001; }
      else if (side === 1) { x = 1; y = Math.random(); vx = -(Math.random()*0.003+0.001); vy = (Math.random()-0.5)*0.003; }
      else if (side === 2) { x = Math.random(); y = 1; vx = (Math.random()-0.5)*0.003; vy = -(Math.random()*0.003+0.001); }
      else                 { x = 0; y = Math.random(); vx = Math.random()*0.003+0.001; vy = (Math.random()-0.5)*0.003; }
      shooters.push({ x, y, vx, vy, life: 1, trail: [] });
    }
    setInterval(spawnShooter, 3200);

    const nebulae = [
      { cx:0.12, cy:0.18, rx:0.48, ry:0.38, r:75,  g:35,  b:210, a:0.10,  phase:0,          spd:0.00007, amp:70 },
      { cx:0.88, cy:0.82, rx:0.52, ry:0.42, r:18,  g:75,  b:195, a:0.08,  phase:Math.PI,     spd:0.00005, amp:55 },
      { cx:0.5,  cy:0.5,  rx:0.22, ry:0.22, r:195, g:125, b:10,  a:0.045, phase:Math.PI*0.6, spd:0.00011, amp:35 },
      { cx:0.2,  cy:0.75, rx:0.30, ry:0.25, r:120, g:20,  b:180, a:0.055, phase:Math.PI*1.4, spd:0.00009, amp:45 }
    ];

    const filaments = Array.from({ length: 18 }, () => ({
      ang:   Math.random() * Math.PI * 2,
      len:   Math.random() * 0.28 + 0.12,
      width: Math.random() * 0.8 + 0.2,
      alpha: Math.random() * 0.04 + 0.01,
      spd:   Math.random() * 0.00006 + 0.00002
    }));

    const particles = [];
    function burst(x, y, gold) {
      for (let i = 0; i < 22; i++) {
        const a = Math.random()*Math.PI*2, s = Math.random()*3.2+0.4;
        particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, r:Math.random()*2.2+0.6, gold: gold||Math.random()>0.4, slow:false });
      }
      for (let i = 0; i < 8; i++) {
        const a = Math.random()*Math.PI*2, s = Math.random()*1.2+0.2;
        particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, r:Math.random()*1+0.3, gold:true, slow:true });
      }
    }

    const rings = [];
    function addRing(x, y) { rings.push({ x, y, r:0, life:1 }); }

    function drawBg() {
      const W = cBg.width, H = cBg.height;
      bx.clearRect(0, 0, W, H);
      nebulae.forEach(n => {
        n.phase += n.spd;
        const ox = Math.sin(n.phase)*n.amp, oy = Math.cos(n.phase*0.7)*n.amp*0.6;
        const cx = n.cx*W+ox, cy = n.cy*H+oy;
        const g = bx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*n.rx);
        g.addColorStop(0,   `rgba(${n.r},${n.g},${n.b},${n.a})`);
        g.addColorStop(0.5, `rgba(${n.r},${n.g},${n.b},${n.a*0.3})`);
        g.addColorStop(1,   'rgba(0,0,0,0)');
        bx.save(); bx.scale(1, n.ry/n.rx);
        bx.beginPath(); bx.arc(cx, cy*(n.rx/n.ry), Math.min(W,H)*n.rx, 0, Math.PI*2);
        bx.fillStyle = g; bx.fill(); bx.restore();
      });
      stars.forEach(s => {
        s.ph += s.sp;
        const a = 0.45 + 0.55*Math.abs(Math.sin(s.ph));
        bx.beginPath();
        bx.arc(s.x*W, s.y*H, s.bright ? s.r*1.7 : s.r, 0, Math.PI*2);
        bx.fillStyle = s.warm ? `rgba(255,228,150,${s.bright?a*0.9:a*0.48})` : `rgba(208,218,245,${s.bright?a*0.85:a*0.42})`;
        bx.fill();
        if (s.bright) {
          bx.beginPath(); bx.arc(s.x*W, s.y*H, s.r*4, 0, Math.PI*2);
          bx.fillStyle = s.warm ? `rgba(255,210,80,${0.04*a})` : `rgba(180,200,255,${0.04*a})`;
          bx.fill();
        }
      });
      for (let i = shooters.length-1; i >= 0; i--) {
        const s = shooters[i];
        s.trail.push({x:s.x, y:s.y});
        if (s.trail.length > 14) s.trail.shift();
        s.x += s.vx; s.y += s.vy; s.life -= 0.012;
        if (s.life <= 0 || s.x < 0 || s.x > 1 || s.y < 0 || s.y > 1) { shooters.splice(i,1); continue; }
        if (s.trail.length > 1) {
          const gr = bx.createLinearGradient(s.trail[0].x*W, s.trail[0].y*H, s.x*W, s.y*H);
          gr.addColorStop(0, 'rgba(255,240,180,0)');
          gr.addColorStop(1, `rgba(255,245,200,${s.life*0.7})`);
          bx.beginPath(); bx.moveTo(s.trail[0].x*W, s.trail[0].y*H);
          s.trail.forEach(p => bx.lineTo(p.x*W, p.y*H));
          bx.strokeStyle = gr; bx.lineWidth = 1.2; bx.stroke();
        }
        bx.beginPath(); bx.arc(s.x*W, s.y*H, 1.2, 0, Math.PI*2);
        bx.fillStyle = `rgba(255,250,210,${s.life*0.9})`; bx.fill();
      }
    }

    function drawMid() {
      const W = cMid.width, H = cMid.height;
      mx.clearRect(0, 0, W, H);
      const cx = W/2, cy = H/2;
      filaments.forEach(f => {
        f.ang += f.spd;
        const x1=cx+Math.cos(f.ang)*W*0.04, y1=cy+Math.sin(f.ang)*H*0.04;
        const x2=cx+Math.cos(f.ang)*W*f.len, y2=cy+Math.sin(f.ang)*H*f.len;
        const g = mx.createLinearGradient(x1,y1,x2,y2);
        g.addColorStop(0,   `rgba(212,175,55,${f.alpha*1.5})`);
        g.addColorStop(0.6, `rgba(212,175,55,${f.alpha*0.5})`);
        g.addColorStop(1,   'rgba(212,175,55,0)');
        mx.beginPath(); mx.moveTo(x1,y1); mx.lineTo(x2,y2);
        mx.strokeStyle = g; mx.lineWidth = f.width; mx.stroke();
      });
    }

    function drawFx() {
      const W = cFx.width, H = cFx.height;
      fx.clearRect(0, 0, W, H);
      for (let i = rings.length-1; i >= 0; i--) {
        const rng = rings[i];
        rng.r += 2.8; rng.life -= 0.018;
        if (rng.life <= 0) { rings.splice(i,1); continue; }
        fx.beginPath(); fx.arc(rng.x, rng.y, rng.r, 0, Math.PI*2);
        fx.strokeStyle = `rgba(212,175,55,${rng.life*0.35})`;
        fx.lineWidth = 1.5*rng.life; fx.stroke();
      }
      for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= p.slow ? 0.92 : 0.94;
        p.vy *= p.slow ? 0.92 : 0.94;
        p.life -= p.slow ? 0.016 : 0.022;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        const grd = fx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*p.life*2.5);
        if (p.gold) {
          grd.addColorStop(0,   `rgba(255,240,120,${p.life*0.9})`);
          grd.addColorStop(0.5, `rgba(212,160,20,${p.life*0.5})`);
          grd.addColorStop(1,   'rgba(150,90,0,0)');
        } else {
          grd.addColorStop(0, `rgba(200,220,255,${p.life*0.8})`);
          grd.addColorStop(1, 'rgba(100,150,255,0)');
        }
        fx.beginPath(); fx.arc(p.x,p.y,p.r*p.life*2,0,Math.PI*2);
        fx.fillStyle = grd; fx.fill();
      }
    }

    function loop() { drawBg(); drawMid(); drawFx(); requestAnimationFrame(loop); }
    loop();

    const nodes = document.querySelectorAll('.node');
    const tip   = document.getElementById('tip');
    const tipTx = document.getElementById('tipTx');

    nodes.forEach(nd => {
      nd.addEventListener('click', function () {
        const rect = this.getBoundingClientRect();
        const px = rect.left + rect.width/2;
        const py = rect.top  + rect.height/2;
        if (this.classList.contains('on')) {
          this.classList.remove('on'); tip.classList.remove('on'); return;
        }
        nodes.forEach(x => x.classList.remove('on'));
        this.classList.add('on');
        burst(px, py, true);
        addRing(px, py);
        setTimeout(() => addRing(px, py), 200);
        setTimeout(() => addRing(px, py), 450);
        tipTx.textContent = this.dataset.msg;
        tip.classList.add('on');
      });
    });

    setInterval(() => {
      const W = cFx.width, H = cFx.height;
      burst(W*0.3 + Math.random()*W*0.4, H*0.3 + Math.random()*H*0.4, false);
    }, 8000);
  })();
  </script>

</body>
</html>
