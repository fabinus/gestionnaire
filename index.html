<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie Familiale</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --orbit-size: 550px; /* Taille du cercle de rotation */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- TITRE CENTRAL --- */
        .welcome-core {
            position: absolute; /* Fixé au centre exact */
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 70px;
            border-radius: 100px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            pointer-events: none; /* Pour que les clics passent à travers vers les tuiles si besoin */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #1e293b;
            letter-spacing: -2px;
        }

        /* --- LE CONTENEUR D'ORBITE --- */
        .orbit-system {
            position: relative;
            width: var(--orbit-size);
            height: var(--orbit-size);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateSystem 30s linear infinite;
        }

        /* --- LES TUILES --- */
        .tile {
            position: absolute;
            padding: 12px 25px;
            background: white;
            border-radius: 15px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            /* On annule la rotation du système pour garder le texte droit */
            animation: counterRotate 30s linear infinite;
        }

        /* Placement des tuiles sur le cercle (Trigonométrie) */
        /* On les écarte du centre de (var(--orbit-size) / 2) */
        .t1 { transform: translate(275px) rotate(0deg); }
        .t2 { transform: rotate(45deg) translate(275px) rotate(-45deg); }
        .t3 { transform: rotate(90deg) translate(275px) rotate(-90deg); }
        .t4 { transform: rotate(135deg) translate(275px) rotate(-135deg); }
        .t5 { transform: rotate(180deg) translate(275px) rotate(-180deg); }
        .t6 { transform: rotate(225deg) translate(275px) rotate(-225deg); }
        .t7 { transform: rotate(270deg) translate(275px) rotate(-270deg); }
        .t8 { transform: rotate(315deg) translate(275px) rotate(-315deg); }

        /* --- EFFETS UNIQUES PAR TUILE --- */
        .t1 { border-left: 5px solid #6366f1; } /* Fabien */
        .t2 { background: rgba(255,255,255,0.5); backdrop-filter: blur(5px); border: 1px solid white; } /* Clément */
        .t3 { box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff; } /* Célestine */
        .t4 { border: 2px solid #f472b6; color: #db2777; } /* Yvon */
        .t5 { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.4)); } /* Isabelle */
        .t6 { text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #1e293b; } /* Bernard */
        .t7 { border-radius: 50px; background: #f1f5f9; font-style: italic; } /* Paulette */
        .t8 { background: linear-gradient(145deg, #ffffff, #e2e8f0); border: 1px solid #cbd5e1; } /* Corentin */

        /* --- ÉTAT LORS DU CLIC (Agrandissement) --- */
        .tile.active {
            scale: 2;
            z-index: 500;
            background: #1e293b;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes rotateSystem {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Stop au survol du système */
        .orbit-system:hover, .orbit-system:hover .tile {
            animation-play-state: paused;
        }

        /* Responsive */
        @media (max-width: 768px) {
            :root { --orbit-size: 320px; }
            h1 { font-size: 2rem; }
            .welcome-core { padding: 20px 40px; }
            .t1 { transform: translate(160px); }
            /* ... ajustements automatiques pour mobile ... */
        }
    </style>
</head>
<body>

    <div class="welcome-core">
        <h1>Bienvenue</h1>
    </div>

    <div class="orbit-system" id="system">
        <div class="tile t1" onclick="toggleActive(this)">Fabien</div>
        <div class="tile t2" onclick="toggleActive(this)">Clément</div>
        <div class="tile t3" onclick="toggleActive(this)">Célestine</div>
        <div class="tile t4" onclick="toggleActive(this)">Yvon</div>
        <div class="tile t5" onclick="toggleActive(this)">Isabelle</div>
        <div class="tile t6" onclick="toggleActive(this)">Bernard</div>
        <div class="tile t7" onclick="toggleActive(this)">Paulette</div>
        <div class="tile t8" onclick="toggleActive(this)">Corentin</div>
    </div>

    <script>
        function toggleActive(element) {
            // Si on clique sur une tuile déjà active, on l'enlève
            if(element.classList.contains('active')) {
                element.classList.remove('active');
            } else {
                // Sinon on enlève l'active des autres et on l'ajoute à celle-là
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                element.classList.add('active');
            }
        }
    </script>
</body>
</html>
