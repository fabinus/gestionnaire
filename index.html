<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxie Familiale | Version Claire</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Passage sur un fond nacré/gris très clair */
      background: #f8fafc; 
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Nébuleuses claires et colorées (Pastel) */
    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.5; /* Plus doux en mode clair */
    }
    .nebula-1 { width: 500px; height: 500px; background: rgba(100,180,255,0.2); top: -150px; left: -150px; }
    .nebula-2 { width: 600px; height: 600px; background: rgba(255,182,193,0.15); bottom: -200px; right: -200px; }
    .nebula-3 { width: 300px; height: 300px; background: rgba(255,223,137,0.15); top: 50%; left: 50%; transform: translate(-50%,-50%); }

    .orbit-scene {
      position: relative;
      z-index: 10;
      width: 560px;
      height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(74, 144, 226, 0.1);
    }

    .core {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      /* Cœur en verre blanc (Glassmorphism clair) */
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.03),
        inset 0 0 20px rgba(255,255,255,0.5);
    }

    .core-label {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 7px;
      color: #4a90e2;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .core-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      font-weight: 300;
      color: #1e293b; /* Texte sombre pour le contraste */
      line-height: 1;
      letter-spacing: 2px;
    }
    .core-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.8rem;
      font-style: italic;
      color: #64748b;
      margin-top: 10px;
    }

    .orbit-wrap {
      position: absolute;
      inset: 0;
      animation: spin 60s linear infinite;
    }

    .node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: counter-spin 60s linear infinite;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    .node-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4a90e2;
      margin-bottom: 10px;
      transition: all 0.4s ease;
      box-shadow: 0 0 10px rgba(74, 144, 226, 0.2);
    }

    .node-name {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.4s ease;
    }

    /* Effets de survol et actif adaptés au mode clair */
    .node:hover .node-dot {
      background: #1e293b;
      transform: scale(1.8);
      box-shadow: 0 0 15px rgba(30, 41, 59, 0.3);
    }
    .node.active .node-dot {
      background: #1e293b;
      transform: scale(2.5);
    }
    .node.active .node-name {
      color: #000;
      font-size: 1.8rem;
      letter-spacing: 4px;
    }

    /* Positions (identiques à Claude) */
    .n1 { top: 0%;   left: 50%; translate: -50% 0; }
    .n2 { top: 8%;   left: 83%; }
    .n3 { top: 38%;  left: 97%; translate: -100% -50%; }
    .n4 { top: 78%;  left: 83%; }
    .n5 { top: 97%;  left: 50%; translate: -50% -100%; }
    .n6 { top: 78%;  left: 17%; translate: -100% 0; }
    .n7 { top: 38%;  left: 3%;  translate: 0 -50%; }
    .n8 { top: 8%;   left: 17%; translate: -100% 0; }

    #tooltip {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #4a90e2;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 100;
    }
    #tooltip.show { opacity: 1; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes counter-spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

    @media (max-width: 640px) { .orbit-scene { transform: scale(0.6); } }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

  <div class="orbit-scene">
    <div class="orbit-ring"></div>
    
    <div class="core">
      <span class="core-label">Univers</span>
      <span class="core-title">Bienvenue</span>
      <span class="core-sub">Galaxie Familiale</span>
    </div>

    <div class="orbit-wrap" id="orbitWrap">
      <div class="node n1" onclick="activate(this,'Fabien')">    <div class="node-dot"></div><span class="node-name">Fabien</span></div>
      <div class="node n2" onclick="activate(this,'Clément')">   <div class="node-dot"></div><span class="node-name">Clément</span></div>
      <div class="node n3" onclick="activate(this,'Célestine')"> <div class="node-dot"></div><span class="node-name">Célestine</span></div>
      <div class="node n4" onclick="activate(this,'Yvon')">      <div class="node-dot"></div><span class="node-name">Yvon</span></div>
      <div class="node n5" onclick="activate(this,'Isabelle')">  <div class="node-dot"></div><span class="node-name">Isabelle</span></div>
      <div class="node n6" onclick="activate(this,'Bernard')">   <div class="node-dot"></div><span class="node-name">Bernard</span></div>
      <div class="node n7" onclick="activate(this,'Paulette')">  <div class="node-dot"></div><span class="node-name">Paulette</span></div>
      <div class="node n8" onclick="activate(this,'Corentin')">  <div class="node-dot"></div><span class="node-name">Corentin</span></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    // Le script de Claude pour les étoiles (adapté pour être plus visible sur fond clair)
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 150 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.5,
      o: Math.random() * 0.4 + 0.1,
      speed: Math.random() * 0.2 + 0.05
    }));

    let t = 0;
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t += 0.005;
      stars.forEach(s => {
        const op = s.o * (0.5 + 0.5 * Math.sin(t * s.speed + s.x * 10));
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
        // Étoiles gris-bleu pour le mode clair
        ctx.fillStyle = `rgba(74, 144, 226, ${op})`; 
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    const msgs = {
      'Fabien': 'Une étoile de la constellation familiale',
      'Clément': 'Lumière brillante dans notre galaxie',
      'Célestine': 'Astre précieux et singulier',
      'Yvon': 'Pilier de notre univers',
      'Isabelle': 'Éclat doux et chaleureux',
      'Bernard': 'Force tranquille et fidèle',
      'Paulette': 'Flamme douce et ancienne',
      'Corentin': 'Nouvelle étoile en formation'
    };

    const tip = document.getElementById('tooltip');

    function activate(el, name) {
      const nodes = document.querySelectorAll('.node');
      if (el.classList.contains('active')) {
        el.classList.remove('active');
        tip.classList.remove('show');
      } else {
        nodes.forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        tip.textContent = msgs[name];
        tip.classList.add('show');
      }
    }
  </script>

</body>
</html>
