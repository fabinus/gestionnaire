<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Galaxie Familiale</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: var(--bg);
            background-image: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- TITRE CENTRAL --- */
        .welcome-core {
            position: relative;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px 100px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            color: #1e293b;
            letter-spacing: -2px;
        }

        /* --- L'ORBITE --- */
        .orbit-container {
            position: absolute;
            width: 800px; /* Taille de l'orbite */
            height: 800px;
            border-radius: 50%;
            animation: rotateOrbit 40s linear infinite;
        }

        /* --- STYLE COMMUN DES TUILES --- */
        .tile {
            position: absolute;
            padding: 12px 24px;
            background: white;
            border-radius: 15px;
            font-weight: 600;
            color: #475569;
            /* Animation pour garder le texte droit */
            animation: counterRotate 40s linear infinite;
            transition: all 0.3s ease;
        }

        /* --- POSITIONNEMENT ET EFFETS UNIQUES --- */

        /* 1. Fabien - Effet Néon Doux */
        .t-fabien { 
            top: 0; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            border: 2px solid #6366f1;
        }

        /* 2. Clément - Effet Glassmorphism Pur */
        .t-clement { 
            top: 15%; right: 15%;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* 3. Célestine - Effet Ombre 3D (Neumorphism) */
        .t-celestine { 
            top: 50%; right: 0; transform: translateY(-50%);
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }

        /* 4. Yvon - Effet Bordure Gradient */
        .t-yvon { 
            bottom: 15%; right: 15%;
            background: linear-gradient(white, white) padding-box, 
                        linear-gradient(45deg, #f093fb, #f5576c) border-box;
            border: 3px solid transparent;
        }

        /* 5. Isabelle - Effet Flou Lumineux */
        .t-isabelle { 
            bottom: 0; left: 50%; transform: translateX(-50%);
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.5));
        }

        /* 6. Bernard - Effet Épuré Minimaliste */
        .t-bernard { 
            bottom: 15%; left: 15%;
            border-bottom: 4px solid #1e293b;
            border-radius: 0;
        }

        /* 7. Paulette - Effet Soft Pink & Round */
        .t-paulette { 
            top: 50%; left: 0; transform: translateY(-50%);
            background: #fff5f7;
            color: #da627d;
            border-radius: 50px;
        }

        /* 8. Corentin - Effet Reflet Métallique */
        .t-corentin { 
            top: 15%; left: 15%;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: 1px solid #ccc;
        }

        /* --- ANIMATIONS --- */
        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Hover effect pour stopper l'animation au survol */
        .orbit-container:hover {
            animation-play-state: paused;
        }
        .orbit-container:hover .tile {
            animation-play-state: paused;
            scale: 1.2;
            z-index: 200;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .orbit-container { width: 500px; height: 500px; }
            h1 { font-size: 2.5rem; }
            .welcome-core { padding: 30px 60px; }
        }
    </style>
</head>
<body>

    <div class="welcome-core">
        <h1>Bienvenue</h1>
    </div>

    <!-- Le cercle qui tourne -->
    <div class="orbit-container">
        <div class="tile t-fabien">Fabien</div>
        <div class="tile t-clement">Clément</div>
        <div class="tile t-celestine">Célestine</div>
        <div class="tile t-yvon">Yvon</div>
        <div class="tile t-isabelle">Isabelle</div>
        <div class="tile t-bernard">Bernard</div>
        <div class="tile t-paulette">Paulette</div>
        <div class="tile t-corentin">Corentin</div>
    </div>

</body>
</html>
