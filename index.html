<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxie Familiale | Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04070a; }
    body { display: flex; align-items: center; justify-content: center; }

    canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

    /* NÉBULEUSES AVEC EFFET DE PROFONDEUR */
    .nebula { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 1; transition: transform 0.2s ease-out; }
    .nebula-1 { width: 600px; height: 600px; background: rgba(80,40,220,0.08); top: -10%; left: -10%; }
    .nebula-2 { width: 700px; height: 700px; background: rgba(20,80,180,0.06); bottom: -15%; right: -15%; }
    .nebula-3 { width: 400px; height: 400px; background: rgba(212,175,55,0.04); top: 50%; left: 50%; transform: translate(-50%,-50%); }

    .orbit-scene {
      position: relative;
      z-index: 10;
      width: 560px;
      height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    /* RAYONS DE LUMIÈRE SUBTILS */
    .shine-line {
      position: absolute;
      top: 0; left: 50%; width: 1px; height: 50%;
      transform-origin: bottom center;
      background: linear-gradient(to top, rgba(212,175,55,0.1), transparent);
      pointer-events: none;
    }

    /* CŒUR CENTRAL AMÉLIORÉ */
    .core {
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1a1410 0%, #06070d 100%);
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 0 80px rgba(0,0,0,0.8), inset 0 0 40px rgba(212,175,55,0.05);
      transition: border 0.5s ease;
    }

    .core-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      font-weight: 300;
      color: #f0e8d0;
      line-height: 1;
      letter-spacing: 2px;
      /* Dégradé sur le texte */
      background: linear-gradient(to bottom, #f0e8d0, #b89b5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* SYSTÈME ORBITAL AVEC CONTRÔLE DE VITESSE */
    .orbit-wrap {
      position: absolute;
      inset: 0;
      animation: spin 80s linear infinite;
      transition: animation-duration 1s ease;
    }

    /* Ralentissement au survol de la scène */
    .orbit-scene:hover .orbit-wrap { animation-duration: 180s; }

    .node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      animation: counter-spin 80s linear infinite;
      transition: animation-duration 1s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .orbit-scene:hover .node { animation-duration: 180s; }

    .node-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(212,175,55,0.4);
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    .node-name {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: rgba(240,225,185,0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    /* HOVER & ACTIVE */
    .node:hover .node-dot { background: #d4af37; transform: scale(2); box-shadow: 0 0 15px #d4af37; }
    .node:hover .node-name { color: #fff; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
    
    .node.active .node-dot { background: #fff; transform: scale(2.5); box-shadow: 0 0 20px #fff; }
    .node.active .node-name { color: #fff; font-size: 1.6rem; letter-spacing: 5px; font-weight: 600; }

    /* POSITIONS */
    .n1 { top: 0%;   left: 50%; translate: -50% 0; }
    .n2 { top: 8%;   left: 83%; }
    .n3 { top: 38%;  left: 97%; translate: -100% -50%; }
    .n4 { top: 78%;  left: 83%; }
    .n5 { top: 97%;  left: 50%; translate: -50% -100%; }
    .n6 { top: 78%;  left: 17%; translate: -100% 0; }
    .n7 { top: 38%;  left: 3%;  translate: 0 -50%; }
    .n8 { top: 8%;   left: 17%; translate: -100% 0; }

    #tooltip {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: rgba(212,175,55,0.7);
      opacity: 0;
      transition: opacity 0.5s ease;
      letter-spacing: 1px;
    }
    #tooltip.show { opacity: 1; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes counter-spin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

    @media (max-width: 640px) { .orbit-scene { transform: scale(0.6); } }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="nebula nebula-1" id="neb1"></div>
  <div class="nebula nebula-2" id="neb2"></div>
  <div class="nebula nebula-3"></div>

  <div class="orbit-scene" id="scene">
    <div class="shine-line" style="transform:rotate(0deg)"></div>
    <div class="shine-line" style="transform:rotate(45deg)"></div>
    <div class="shine-line" style="transform:rotate(90deg)"></div>
    <div class="shine-line" style="transform:rotate(135deg)"></div>
    <div class="shine-line" style="transform:rotate(180deg)"></div>
    <div class="shine-line" style="transform:rotate(225deg)"></div>
    <div class="shine-line" style="transform:rotate(270deg)"></div>
    <div class="shine-line" style="transform:rotate(315deg)"></div>

    <div class="core">
      <span style="font-family:'Cinzel'; font-size:0.5rem; letter-spacing:5px; color:rgba(212,175,55,0.5); margin-bottom:10px;">UNIVERS</span>
      <span class="core-title">Bienvenue</span>
      <div style="width:30px; height:1px; background:rgba(212,175,55,0.3); margin-top:15px;"></div>
    </div>

    <div class="orbit-wrap">
      <div class="node n1" onclick="activate(this,'Fabien')"><div class="node-dot"></div><span class="node-name">Fabien</span></div>
      <div class="node n2" onclick="activate(this,'Clément')"><div class="node-dot"></div><span class="node-name">Clément</span></div>
      <div class="node n3" onclick="activate(this,'Célestine')"><div class="node-dot"></div><span class="node-name">Célestine</span></div>
      <div class="node n4" onclick="activate(this,'Yvon')"><div class="node-dot"></div><span class="node-name">Yvon</span></div>
      <div class="node n5" onclick="activate(this,'Isabelle')"><div class="node-dot"></div><span class="node-name">Isabelle</span></div>
      <div class="node n6" onclick="activate(this,'Bernard')"><div class="node-dot"></div><span class="node-name">Bernard</span></div>
      <div class="node n7" onclick="activate(this,'Paulette')"><div class="node-dot"></div><span class="node-name">Paulette</span></div>
      <div class="node n8" onclick="activate(this,'Corentin')"><div class="node-dot"></div><span class="node-name">Corentin</span></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    // PARALLAXE MOUSE EFFECT
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 50;
      const y = (window.innerHeight / 2 - e.pageY) / 50;
      document.getElementById('neb1').style.transform = `translate(${x}px, ${y}px)`;
      document.getElementById('neb2').style.transform = `translate(${-x}px, ${-y}px)`;
      document.getElementById('scene').style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
    });

    // STARS CANVAS (CLAUDE VERSION IMPROVED)
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const stars = Array.from({ length: 200 }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * 1.5, o: Math.random(), s: Math.random() * 0.02
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.o += s.s;
        const alpha = Math.abs(Math.sin(s.o));
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${alpha * 0.5})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    const msgs = {
      'Fabien': 'Une étoile de la constellation familiale',
      'Clément': 'Lumière brillante dans notre galaxie',
      'Célestine': 'Astre précieux et singulier',
      'Yvon': 'Pilier de notre univers',
      'Isabelle': 'Éclat doux et chaleureux',
      'Bernard': 'Force tranquille et fidèle',
      'Paulette': 'Flamme douce et ancienne',
      'Corentin': 'Nouvelle étoile en formation'
    };

    function activate(el, name) {
      const tip = document.getElementById('tooltip');
      if (el.classList.contains('active')) {
        el.classList.remove('active');
        tip.classList.remove('show');
      } else {
        document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        tip.textContent = msgs[name];
        tip.classList.add('show');
      }
    }
  </script>
</body>
</html>
