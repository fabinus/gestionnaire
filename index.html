<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>
    <style>
        /* On bloque tout au centre de l'écran quoi qu'il arrive */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* LE TITRE AU MILIEU */
        .bienvenue {
            position: absolute;
            z-index: 10;
            background: white;
            padding: 20px 50px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-size: 2.5rem;
            font-weight: bold;
            color: #2d3748;
        }

        /* LE CERCLE QUI PORTE LES NOMS */
        .orbite {
            position: relative;
            width: 500px; /* Taille fixe pour ne pas s'enfuir */
            height: 500px;
            animation: rotation 20s linear infinite;
        }

        /* STYLE DES TUILES */
        .nom {
            position: absolute;
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            /* On annule la rotation pour garder le texte droit */
            animation: contre-rotation 20s linear infinite;
            transition: all 0.3s ease;
        }

        /* POSITIONNEMENT FIXE (Sûr à 100%) */
        .n1 { top: 0%; left: 50%; transform: translate(-50%, -50%); border-top: 4px solid #4299e1; }
        .n2 { top: 15%; left: 85%; border-top: 4px solid #ed64a6; }
        .n3 { top: 50%; left: 100%; transform: translate(-50%, -50%); border-top: 4px solid #ecc94b; }
        .n4 { top: 85%; left: 85%; border-top: 4px solid #48bb78; }
        .n5 { top: 100%; left: 50%; transform: translate(-50%, -50%); border-top: 4px solid #38b2ac; }
        .n6 { top: 85%; left: 15%; border-top: 4px solid #ed8936; }
        .n7 { top: 50%; left: 0%; transform: translate(-50%, -50%); border-top: 4px solid #9f7aea; }
        .n8 { top: 15%; left: 15%; border-top: 4px solid #f56565; }

        /* EFFET AU CLIC */
        .nom.active {
            transform: scale(2) !important;
            background: #1a202c;
            color: white;
            z-index: 100;
        }

        /* ANIMATIONS SIMPLE */
        @keyframes rotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes contre-rotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Arrêt au survol */
        .orbite:hover, .orbite:hover .nom {
            animation-play-state: paused;
        }
    </style>
</head>
<body>

    <div class="bienvenue">Bienvenue</div>

    <div class="orbite">
        <div class="nom n1" onclick="this.classList.toggle('active')">Fabien</div>
        <div class="nom n2" onclick="this.classList.toggle('active')">Clément</div>
        <div class="nom n3" onclick="this.classList.toggle('active')">Célestine</div>
        <div class="nom n4" onclick="this.classList.toggle('active')">Yvon</div>
        <div class="nom n5" onclick="this.classList.toggle('active')">Isabelle</div>
        <div class="nom n6" onclick="this.classList.toggle('active')">Bernard</div>
        <div class="nom n7" onclick="this.classList.toggle('active')">Paulette</div>
        <div class="nom n8" onclick="this.classList.toggle('active')">Corentin</div>
    </div>

</body>
</html>
