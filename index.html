<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Famille</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABLES DE COULEURS CLAIRES --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text-color: #4a5568;
            --accent-color: #667eea;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Important pour les bulles qui gravitent */
            color: var(--text-color);
        }

        /* --- TITRE CENTRAL --- */
        .center-content {
            position: relative;
            z-index: 100;
            text-align: center;
            background: var(--glass-bg);
            padding: 40px 80px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* --- SYSTÈME DE TUILES FLOTTANTES --- */
        .name-tag {
            position: absolute;
            padding: 15px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            z-index: 10;
        }

        .name-tag:hover {
            transform: scale(1.1) translateY(-10px);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.2);
        }

        /* --- STYLES ET ANIMATIONS SPÉCIFIQUES --- */
        
        /* 1. Fabien - Effet Lueur Bleue */
        .tag-fabien { 
            top: 15%; left: 20%; 
            animation: float 6s infinite ease-in-out; 
            border-bottom: 3px solid #63b3ed;
        }

        /* 2. Clément - Effet Halo Violet */
        .tag-clement { 
            top: 25%; right: 15%; 
            animation: float 8s infinite ease-in-out -2s;
            box-shadow: 0 0 20px rgba(159, 122, 234, 0.2);
        }

        /* 3. Célestine - Effet Doux Rose */
        .tag-celestine { 
            bottom: 20%; left: 10%; 
            animation: float 7s infinite ease-in-out -1s;
            border-left: 3px solid #fbb6ce;
        }

        /* 4. Yvon - Effet Ombre Portée */
        .tag-yvon { 
            bottom: 15%; right: 25%; 
            animation: float 9s infinite ease-in-out -4s;
            box-shadow: 5px 5px 0px rgba(102, 126, 234, 0.1);
        }

        /* 5. Isabelle - Effet Bordure Brillante */
        .tag-isabelle { 
            top: 10%; left: 50%; 
            animation: float 10s infinite ease-in-out -3s;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
        }

        /* 6. Bernard - Effet Solide / Épuré */
        .tag-bernard { 
            bottom: 40%; right: 5%; 
            animation: float 11s infinite ease-in-out -5s;
            border: 2px dashed rgba(102, 126, 234, 0.3);
        }

        /* 7. Paulette - Effet Arrondi Soft */
        .tag-paulette { 
            top: 45%; left: 5%; 
            animation: float 8s infinite ease-in-out -6s;
            border-radius: 50px;
        }

        /* 8. Corentin - Effet Miroir */
        .tag-corentin { 
            bottom: 5%; left: 40%; 
            animation: float 7s infinite ease-in-out -2s;
            border-top: 3px solid #a3bded;
        }

        /* --- ANIMATION DE FLOTTAISON --- */
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(15px, -20px) rotate(2deg); }
            66% { transform: translate(-10px, 10px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .center-content { padding: 20px 40px; }
            .name-tag { font-size: 0.8rem; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <!-- Contenu Central -->
    <div class="center-content">
        <h1>Bienvenue</h1>
    </div>

    <!-- Tuiles des prénoms -->
    <div class="name-tag tag-fabien">Fabien</div>
    <div class="name-tag tag-clement">Clément</div>
    <div class="name-tag tag-celestine">Célestine</div>
    <div class="name-tag tag-yvon">Yvon</div>
    <div class="name-tag tag-isabelle">Isabelle</div>
    <div class="name-tag tag-bernard">Bernard</div>
    <div class="name-tag tag-paulette">Paulette</div>
    <div class="name-tag tag-corentin">Corentin</div>

</body>
</html>
