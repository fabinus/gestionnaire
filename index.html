<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue | Univers Familial</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4f8;
            --glass: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.8);
            --text: #2d3748;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at center, #ffffff 0%, #dbeafe 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text);
        }

        /* --- CONTENEUR D'ORBITE --- */
        .orbit-container {
            position: relative;
            width: 700px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CŒUR CENTRAL --- */
        .center-card {
            position: relative;
            z-index: 100;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 50%;
            width: 280px;
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--border);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.05);
        }

        .center-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            background: linear-gradient(to bottom, #2d3748, #718096);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- SYSTÈME ORBITAL --- */
        .orbit-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 40s linear infinite;
        }

        .tile {
            position: absolute;
            width: 110px;
            height: 60px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: counter-rotate 40s linear infinite;
        }

        /* --- EFFETS SPÉCIAUX INDIVIDUELS --- */
        .t1 { top: 0%; left: 50%; translate: -50% 0; border-bottom: 3px solid #6366f1; } /* Fabien */
        .t2 { top: 15%; left: 85%; border-radius: 0 20px 0 20px; box-shadow: 0 0 15px rgba(244, 114, 182, 0.3); } /* Clément */
        .t3 { top: 50%; left: 100%; translate: -100% -50%; border-left: 4px dotted #fbbf24; } /* Célestine */
        .t4 { top: 85%; left: 85%; background: rgba(241, 245, 249, 0.8); border-right: 3px solid #4ade80; } /* Yvon */
        .t5 { top: 100%; left: 50%; translate: -50% -100%; border-top: 3px double #2dd4bf; } /* Isabelle */
        .t6 { top: 85%; left: 15%; translate: -100% 0; font-style: italic; border-bottom: 2px solid #334155; } /* Bernard */
        .t7 { top: 50%; left: 0%; translate: 0 -50%; border-radius: 40px; box-shadow: inset 0 0 10px white; } /* Paulette */
        .t8 { top: 15%; left: 15%; translate: -100% 0; background: linear-gradient(white, #e2e8f0); } /* Corentin */

        /* --- CLIC ET SURVOL --- */
        .tile:hover {
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .tile.active {
            transform: scale(2.5) !important;
            z-index: 500;
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        /* --- ANIMATIONS --- */
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Arrêt au survol du système */
        .orbit-wrapper:hover, .orbit-wrapper:hover .tile {
            animation-play-state: paused;
        }

        @media (max-width: 750px) {
            .orbit-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="orbit-container">
        <!-- Centre -->
        <div class="center-card">
            <p style="font-size: 0.7rem; letter-spacing: 5px; color: #718096; margin-bottom: 10px; font-weight: bold;">FAMILLE</p>
            <h1>Bienvenue</h1>
            <div style="width: 30px; height: 2px; background: #cbd5e0; margin: 20px auto;"></div>
        </div>

        <!-- Orbite avec les 8 noms -->
        <div class="orbit-wrapper">
            <div class="tile t1" onclick="toggleActive(this)">Fabien</div>
            <div class="tile t2" onclick="toggleActive(this)">Clément</div>
            <div class="tile t3" onclick="toggleActive(this)">Célestine</div>
            <div class="tile t4" onclick="toggleActive(this)">Yvon</div>
            <div class="tile t5" onclick="toggleActive(this)">Isabelle</div>
            <div class="tile t6" onclick="toggleActive(this)">Bernard</div>
            <div class="tile t7" onclick="toggleActive(this)">Paulette</div>
            <div class="tile t8" onclick="toggleActive(this)">Corentin</div>
        </div>
    </div>

    <script>
        function toggleActive(el) {
            // Si la tuile est déjà active, on la désactive
            if(el.classList.contains('active')) {
                el.classList.remove('active');
            } else {
                // Sinon on enlève l'état actif des autres et on l'ajoute à celle-là
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            }
        }
    </script>

</body>
</html>
