<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clément | Univers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05080d;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #4facfe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* --- LE CONTENEUR D'ORBITE --- */
        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- COEUR CENTRAL --- */
        .center-card {
            position: relative;
            z-index: 100;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 50%;
            width: 280px;
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--border);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.2);
        }

        .center-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: linear-gradient(to bottom, #fff, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- LES TUILES EN ORBITE --- */
        .orbit-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotate 20s linear infinite;
        }

        .tile {
            position: absolute;
            width: 120px;
            height: 120px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            transition: 0.3s;
            /* On annule la rotation du parent pour que le texte reste droit */
            animation: counter-rotate 20s linear infinite;
        }

        .tile:hover {
            border-color: var(--accent);
            background: rgba(79, 172, 254, 0.1);
            transform: scale(1.1);
        }

        .tile i { font-size: 1.5rem; margin-bottom: 10px; }
        .tile span { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* --- POSITIONNEMENT DES TUILES --- */
        .t1 { top: 0; left: 50%; transform: translateX(-50%); }
        .t2 { bottom: 0; left: 50%; transform: translateX(-50%); }
        .t3 { left: 0; top: 50%; transform: translateY(-50%); }
        .t4 { right: 0; top: 50%; transform: translateY(-50%); }

        /* --- ANIMATIONS --- */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes counter-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* --- EFFETS DE FOND --- */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, transparent 70%);
            z-index: 1;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 700px) {
            .orbit-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="orbit-container">
        <!-- Cœur -->
        <div class="center-card">
            <p style="font-size: 0.7rem; letter-spacing: 3px; color: var(--accent);">PROJET</p>
            <h1>Coucou Clément</h1>
        </div>

        <!-- Système orbital -->
        <div class="orbit-wrapper">
            <div class="tile t1">
                <i>📁</i>
                <span>Projets</span>
            </div>
            <div class="tile t2">
                <i>✉️</i>
                <span>Contact</span>
            </div>
            <div class="tile t3">
                <i>⚡</i>
                <span>Skill</span>
            </div>
            <div class="tile t4">
                <i>🌐</i>
                <span>Réseaux</span>
            </div>
        </div>
    </div>

</body>
</html>
